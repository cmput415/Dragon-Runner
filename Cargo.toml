[package]
name = "dragon-runner-rs"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "dragon-runner"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
glob = "0.3"
tempfile = "3"
colored = "2"
csv = "1"
regex = "1"
wait-timeout = "0.2"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
base64 = "0.22"
rayon = "1"
