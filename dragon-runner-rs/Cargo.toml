[package]
name = "dragon-runner-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
glob = "0.3"
tempfile = "3"
colored = "2"
csv = "1"
regex = "1"
wait-timeout = "0.2"
